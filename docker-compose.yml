version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: visualizer_postgres
    restart: always
    environment:
      POSTGRES_USER: visualizer_user
      POSTGRES_PASSWORD: visualizer_password
      POSTGRES_DB: visualizer_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visualizer_user -d visualizer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visualizer_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://visualizer_user:visualizer_password@db:5432/visualizer_db
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    ports:
      - "8000:8000"

volumes:
  postgres_data:
